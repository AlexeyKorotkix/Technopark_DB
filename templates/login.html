{% extends "base.html" %}
{% block title %}Вход в систему{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-cpu fs-1 text-primary"></i>
                    <h3 class="mt-2">ТехноПарк DB</h3>
                    <p class="text-muted small">Войдите в систему для продолжения</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <!-- CSRF-защита (обязательно для Flask-WTF) -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-person"></i> Имя пользователя
                        </label>
                        <input type="text" class="form-control" id="username"
                               name="username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock"></i> Пароль
                        </label>
                        <input type="password" class="form-control" id="password"
                               name="password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </button>
                </form>

                <div class="text-center mt-3">
                    <small class="text-muted">
                        По умолчанию: <code>admin</code> / <code>admin</code>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
