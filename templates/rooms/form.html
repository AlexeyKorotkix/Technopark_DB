{% extends "base.html" %}
{% block title %}{{ 'Редактировать' if action == 'edit' else 'Добавить' }} помещение{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">
                    <i class="bi bi-{{ 'pencil-square' if action == 'edit' else 'plus-circle' }}"></i>
                    {{ 'Редактировать' if action == 'edit' else 'Добавить' }} помещение
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="name" class="form-label">
                            Название <span class="text-danger">*</span>
                        </label>
                        <input type="text" class="form-control" id="name" name="name"
                               value="{{ room.name if room else '' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="laboratory_id" class="form-label">
                            Лаборатория <span class="text-danger">*</span>
                        </label>
                        <select class="form-select" id="laboratory_id" name="laboratory_id" required>
                            <option value="">— Выберите лабораторию —</option>
                            {% for lab in laboratories %}
                                <option value="{{ lab.id }}"
                                    {% if room and room.laboratory_id == lab.id %}selected{% endif %}>
                                    {{ lab.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="floor" class="form-label">Этаж</label>
                            <input type="number" class="form-control" id="floor" name="floor"
                                   value="{{ room.floor if room and room.floor is not none else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="capacity" class="form-label">Вместимость (рабочих мест)</label>
                            <input type="number" class="form-control" id="capacity" name="capacity"
                                   value="{{ room.capacity if room and room.capacity is not none else '' }}">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('rooms.list_rooms') }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Назад
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> Сохранить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
